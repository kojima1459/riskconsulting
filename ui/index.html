<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リスク提案ナビ</title>
<!--INLINE_STYLE-->
<!--EXTERNAL_STYLE_BEGIN--><link rel="stylesheet" href="style.css"><!--EXTERNAL_STYLE_END-->
</head>
<body>
<div id="app" data-active-pane="work">
<header class="topbar">
 <div class="brand"><span class="brand-mark">RN</span><div><span id="brandName">リスク提案ナビ</span><small>法人営業の提案準備</small></div></div>
 <div class="top-actions">
  <button id="newCaseButton" class="primary" data-modal="newcase">新規案件</button>
  <button data-modal="import">案件を取り込む</button><button class="quiet" data-modal="settings">設定</button>
  <button id="scaleButton" class="quiet" data-local="scale">表示: 中</button><button class="quiet" data-action="resize">画面サイズ</button><button class="quiet" data-local="close">終了</button>
 </div>
</header>
<section class="context-bar">
 <div class="case-picker"><label for="caseSelect">案件</label><select id="caseSelect"><option value="">（新規案件）</option></select></div>
 <button class="quiet small" data-modal="rename" data-needs-case="true">名前を変更</button><button class="quiet small" data-action="export_case" data-needs-case="true">エクスポート</button><button class="quiet small" data-modal="archive" data-needs-case="true">案件を削除</button>
 <div class="env"><span id="identity"></span><span id="kbStatus" class="hide-narrow"></span><span id="aiConnection">AI接続: 確認中</span><button class="quiet small" data-action="reload_kb">ナレッジを読み直す</button></div>
</section>
<nav class="compact-pane-tabs" aria-label="表示する領域"><button class="active" data-pane="work" aria-pressed="true">入力・相談</button><button data-pane="content" aria-pressed="false">案件の内容</button></nav>
<main id="workspace"><div id="busyOverlay"></div>
<section id="leftPane" class="left-pane">
 <div class="mode-tabs" role="tablist" aria-label="作業">
  <button id="tabNav" class="active" role="tab" aria-selected="true" data-mode="nav">ナビ</button><button id="tabChat" role="tab" aria-selected="false" data-mode="chat">案件チャット <span id="chatCount" class="badge">0</span></button><button id="tabSpar" role="tab" aria-selected="false" data-mode="spar">商談の予行演習</button>
 </div>
 <div id="navPane" class="mode-content">
  <div id="transportBand" class="transport-band"></div>
  <div class="coach"><div class="coach-top"><span id="coachStep" class="coach-step">STEP 1/6</span><span id="coachDots" class="coach-dots"></span></div><div id="coachText" class="coach-text">1. 会社情報を入力してください。</div><div id="coachCase" class="muted"></div><div class="coach-actions"><button data-view="s1">下書きを右で見る</button><button data-mode="chat">案件チャットで聞く</button><button data-local="help">使い方を開く</button></div></div>
  <div id="warning" class="note warning" hidden></div>
  <section id="sec1" class="step-card open current"><button class="step-head" data-section="sec1" aria-expanded="true"><span class="step-num">1</span><span class="step-title">会社情報<small id="summary1">会社名と本社の場所を入力</small></span><span id="sectionState1" class="step-state todo">未入力</span><span class="step-caret">▼</span></button><div class="step-body">
   <div class="form-row"><div><label for="caseType">種別</label><select id="caseType" data-basics="case_type"><option value="new">新規開拓</option><option value="renewal">更新</option></select></div><div><label for="company">会社名 <span class="required">必須</span></label><input id="company" data-basics="company" placeholder="お客様の会社名"></div></div>
   <div class="form-row"><div><label for="industrySelect">業種マスタ</label><select id="industrySelect"><option value="">業種を選択</option></select></div><div><label for="industryName">業種名 <span class="optional">手入力可</span></label><input id="industryName" data-basics="industry_name"></div><div><label for="industryCode">業種コード</label><input id="industryCode" data-basics="industry_code"></div></div>
   <div class="form-row"><div><label for="address">本社の場所 <span class="required">必須</span></label><input id="address" data-basics="address" placeholder="市区町村まで"></div><div><label for="secCode">証券コード <span class="optional">任意</span></label><input id="secCode" data-basics="sec_code"></div></div>
   <div class="form-row"><div><label for="sites">調べたい拠点 <span class="optional">任意</span></label><input id="sites" data-basics="sites"></div></div>
   <div class="form-footer"><button class="primary small" data-local="saveBasics">会社情報を保存</button></div>
   <div class="subhead">調査指示文</div><div id="prompts"></div><button id="moreBtn" class="text-button" data-local="morePrompts">＋ もっと調べる（残り5本）</button>
   <div class="form-footer"><button class="small" data-url-kind="full">調査ページを開く</button><button class="small" data-url-kind="quick">クイック調査を開く</button></div>
  </div></section>
  <section id="sec2" class="step-card open"><button class="step-head" data-section="sec2" aria-expanded="true"><span class="step-num">2</span><span class="step-title">資料登録<small id="summary2">調査結果や資料の文章を登録</small></span><span id="sectionState2" class="step-state todo">未登録</span><span class="step-caret">▼</span></button><div class="step-body"><div id="materials"></div><div class="total-line"><b id="totalChars">合計 0 字</b><span id="tierHint" class="muted"></span></div><div class="bar"><i id="totalBar" style="width:0%"></i></div><div class="form-footer"><button class="primary" data-local="saveMaterials">登録内容を保存</button></div></div></section>
  <section id="sec3" class="step-card open"><button class="step-head" data-section="sec3" aria-expanded="true"><span class="step-num">3</span><span class="step-title">分析<small>AIが4段階で提案の下書きを分析</small></span><span id="sectionState3" class="step-state todo">未分析</span><span class="step-caret">▼</span></button><div class="step-body"><div id="stages" class="stage-list"></div><div id="progressBox" class="progress-box" role="status" aria-live="polite"><strong id="progressLabel"></strong><div id="progressDetails"></div><div>AIが分析しています。10〜20分ほどかかることがあります。このまま画面を閉じずにお待ちください。</div></div><div class="form-footer"><button class="strong" data-local="run" data-needs-case="true">まとめて分析</button></div></div></section>
  <section id="sec4" class="step-card open"><button class="step-head" data-section="sec4" aria-expanded="true"><span class="step-num">4</span><span class="step-title">出力<small>提案準備の資料を出力</small></span><span id="sectionState4" class="step-state todo">未出力</span><span class="step-caret">▼</span></button><div class="step-body"><div id="outputs"></div><label class="field-check"><input type="checkbox" id="reportReviewed">内容を確認しました</label><div class="form-row"><div><label for="reportReviewedBy">確認者名 <span class="optional">確認したときだけ入力</span></label><input id="reportReviewedBy" placeholder="確認者名"></div></div><div class="form-footer"><button class="primary small" data-action="export_report" data-needs-case="true">レポート出力</button><button class="small" data-action="export_hearing" data-needs-case="true">ヒアリングシート出力</button><button class="small" data-action="report_mail" data-needs-case="true">報告メールを作成</button><button class="quiet small" data-view="s4">提案骨子を見る</button></div></div></section>
  <section id="advancedSection" class="step-card" hidden><button class="step-head" data-section="advancedSection" aria-expanded="false"><span class="step-title">上級</span><span class="step-caret">▼</span></button><div class="step-body adv-body"><button class="small" data-confirm-action="start_round2" data-needs-case="true">第2ラウンドを始める</button><button class="small" data-action="company_save" data-needs-case="true">企業ファイルへ保存</button><button class="small" data-action="company_open" data-needs-case="true">企業ファイルを開く</button><button class="small" data-view="feedback">商談の記録</button><button id="advBtnInbox" class="small" data-view="inbox">受信箱</button><button id="advBtnJudge" class="small" data-view="judge">判断台帳</button><button class="small" data-view="logs">記録を見る</button><button class="small" data-confirm-action="run_tests">テストを実行</button><button class="small" data-local="openSheet" data-needs-case="true">シートで下書きを開く（従来画面）</button></div></section>
 </div>
 <div id="chatPane" class="mode-content" style="display:none">
  <div class="chat-history-heading"><span class="muted">案件の内容についてAIに質問</span><button class="quiet tiny" data-local="clearChat">履歴をクリア</button></div>
  <div id="contextChips" class="context-chips"></div><div class="quick-q"><button class="tiny" data-question="この案件で最優先のリスクは何ですか。根拠も示してください。">最優先リスク</button><button class="tiny" data-question="付保ギャップを1分で説明してください。">ギャップの1分説明</button><button class="tiny" data-question="提案のスライドを、お客様に伝わる言葉に言い換えてください。">スライドの言い換え</button><button class="tiny" data-question="訪問で最初に聞くべき質問を教えてください。">最初の質問</button></div>
  <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
  <form id="chatForm" class="chat-form"><textarea id="chatQuestion" rows="2" aria-label="案件への質問" placeholder="この案件について質問を入力してください"></textarea><div id="chatWarn" class="chat-warn"></div><div class="form-footer"><span class="muted">1問あたり1〜2分。AI利用枠を1回使います。</span><button class="primary" type="submit" data-needs-case="true">送信</button></div></form>
 </div>
 <div id="sparPane" class="mode-content" style="display:none"><div class="chat-history-heading"><button class="small" data-action="sparring_resume" data-needs-case="true">開始／再開</button><button class="quiet tiny" data-view="s3">3. 提案シナリオを開く</button></div><div id="sparNote" class="note info"></div><div id="sparMessages" class="chat-messages" aria-live="polite"></div><form id="sparForm" class="chat-form"><textarea id="sparQuestion" rows="2" aria-label="商談の予行演習での発話" placeholder="お客様に話すつもりで発話を入力してください"></textarea><div class="form-footer"><button class="primary" type="submit" data-needs-case="true">送信</button></div></form></div>
</section>
<div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="左右ペインの幅" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="62" aria-valuenow="42"></div>
<section id="rightPane" class="right-pane"><div class="view-toolbar"><div class="view-title"><h1 id="viewCompany">新規案件</h1><div id="viewPills" class="pills"></div></div><button data-view="report">レポート</button><button data-local="openSheet" data-needs-case="true">シートで開く</button></div><div id="viewTabs" class="view-tabs" role="tablist" aria-label="案件の内容"></div><div id="viewScroll" class="view-scroll"><div id="viewContent" class="view active"></div></div></section>
</main>
<footer class="statusbar"><span id="busyDot" class="status-dot"></span><span id="statusText" role="status" aria-live="polite">Excelに接続しています。</span><span id="saveLocation" class="save-location"></span></footer>
</div>
<div id="modalBackdrop" class="modal-backdrop"><section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><header class="modal-header"><h2 id="modalTitle"></h2><button class="quiet" data-local="closeModal">閉じる</button></header><div id="modalBody" class="modal-body"></div><div id="modalFooter" class="form-footer modal-footer"></div><div id="modalFeedback" class="note error" hidden></div></section></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<textarea id="vbaPayload" class="bridge" aria-hidden="true" tabindex="-1"></textarea><textarea id="vbaResponse" class="bridge" aria-hidden="true" tabindex="-1"></textarea>
<!--INLINE_SCRIPT-->
<!--EXTERNAL_SCRIPT_BEGIN--><script src="markdown.js"></script><script src="views.js"></script><script src="app.js"></script><!--EXTERNAL_SCRIPT_END-->
</body></html>
